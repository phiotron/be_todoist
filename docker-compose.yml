# Hạ tầng dev của Taskly backend. Giá trị lấy từ file .env cùng thư mục (chép từ .env.example rồi tự điền).
# Chạy một lần `docker compose up -d`; nhờ `restart: unless-stopped`, các container tự bật lại mỗi khi Docker Desktop mở.
name: taskly
services:
  db:
    image: postgres:16
    container_name: taskly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskly}
      POSTGRES_USER: ${DB_USER:-taskly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hay dien DB_PASSWORD trong file .env}
    ports:
      - "5432:5432"
    volumes:
      - taskly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskly} -d ${DB_NAME:-taskly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: taskly-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP cho backend gửi email mời
      - "8025:8025" # Giao diện xem hộp thư giả: http://localhost:8025

volumes:
  taskly-db:
