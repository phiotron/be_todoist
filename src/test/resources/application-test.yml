# Chỉ dùng cho test tự động — giá trị giả, KHÔNG phải bí mật thật. Datasource do Testcontainers (@ServiceConnection) cấp.
app:
  jwt:
    secret: test-only-jwt-secret-not-for-production-0123456789
  # Job nền (dọn Idempotency-Key) tắt trong test; test gọi thẳng method của service với Clock cố định.
  jobs:
    enabled: false
  # M13a: giới hạn nhỏ để EmailInboundApiTest chạm tới được (chỉ webhook email đọc các khoá này).
  rate-limit:
    email-inbound:
      per-ip:
        max-requests: 5
        window-seconds: 60
      per-address:
        max-requests: 3
        window-seconds: 3600

taskly:
  limits:
    labels-per-task: 3
  google:
    # Client ID GIẢ, khớp GoogleTestTokens.CLIENT_IDS — test không gọi Google thật.
    # test-android-client chỉ để test "nhiều client ID, aud khớp một trong số đó". Spec 3.1 (12.1): Android client ID
    # KHÔNG đưa vào BE hay app — GOOGLE_CLIENT_IDS thật chỉ chứa Web client ID (aud của ID token).
    client-ids: test-web-client.apps.googleusercontent.com,test-android-client.apps.googleusercontent.com
  totp:
    # base64 của chuỗi ASCII "test-only-totp-key-not-for-prod!" (32 byte) — khoá GIẢ chỉ cho test.
    encryption-key: dGVzdC1vbmx5LXRvdHAta2V5LW5vdC1mb3ItcHJvZCE=
  # M13a: tên miền + bí mật webhook GIẢ (EmailInboundApiTest ký bằng đúng chuỗi này) — không phải bí mật thật.
  email-inbox:
    domain: in.taskly.test
    webhook-secret: test-only-email-webhook-secret-not-real
