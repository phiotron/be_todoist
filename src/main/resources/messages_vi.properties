mail.password-reset.body=Xin chào {0},\n\nTaskly vừa nhận yêu cầu đặt lại mật khẩu cho tài khoản của bạn.\n\nMở liên kết sau trên điện thoại đã cài Taskly:\n{1}\n\nHoặc dán mã này vào màn Đặt lại mật khẩu:\n{2}\n\nMã chỉ dùng được một lần và hết hạn sau {3} phút. Nếu bạn không yêu cầu, hãy bỏ qua email này.
