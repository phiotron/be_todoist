# Server texts — ENGLISH. Every key MUST also exist in messages_vi.properties (MessageBundlesTest checks).
# Values with {0}, {1}... go through MessageFormat: do NOT use single quotes (apostrophes) in those values.

# --- ProblemDetail title by HTTP status (ProblemTexts.titleKey) ---
problem.title.400=Invalid data
problem.title.401=Unauthenticated
problem.title.403=Forbidden
problem.title.404=Not found
problem.title.405=Method not allowed
problem.title.409=Conflict
problem.title.410=No longer valid
problem.title.415=Unsupported media type
problem.title.422=Request cannot be processed
problem.title.429=Too many requests
problem.title.500=Server error
problem.title.503=Service temporarily unavailable
problem.title.default=Error

# --- Default detail for framework errors (ProblemTexts.defaultDetailKey) ---
problem.detail.400=The request body could not be read or is invalid
problem.detail.403=You do not have permission to perform this action
problem.detail.404=The requested path was not found
problem.detail.405=This path does not support the HTTP method used
problem.detail.415=Only JSON data is accepted
problem.detail.429=Too many requests, please try again later
problem.detail.default=Something went wrong, please try again later

