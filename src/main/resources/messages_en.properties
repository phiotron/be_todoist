# --- Password reset email: {0} display name, {1} link, {2} code, {3} minutes until expiry ---
mail.password-reset.subject=Taskly - Reset your password
mail.password-reset.body=Hello {0},\n\nTaskly received a request to reset the password of your account.\n\nOpen this link on a phone with Taskly installed:\n{1}\n\nOr paste this code into the Reset password screen:\n{2}\n\nThe code can be used once and expires in {3} minutes. If you did not request this, you can ignore this email.
