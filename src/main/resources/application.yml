# Cấu hình chính. Giá trị bí mật đọc từ file .env (người dùng tự tạo từ .env.example) — không viết bí mật vào đây.
spring:
  application:
    name: taskly-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskly}
    username: ${DB_USER:taskly}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: taskly
    access-ttl: 15m
    refresh-ttl: 30d
