# Cấu hình chính. Giá trị bí mật đọc từ file .env (người dùng tự tạo từ .env.example) — không viết bí mật vào đây.
spring:
  application:
    name: taskly-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskly}
    username: ${DB_USER:taskly}
    password: ${DB_PASSWORD:}
  flyway:
    # Số V11 (M8a) còn trống vì gộp sau V12–V19: DB dev đã chạy tới V19 vẫn áp V11 được khi M8a về. Không đổi số V đã có.
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    # SMTP — khi dev là Mailpit trong docker-compose (xem thư ở http://localhost:8025). Timeout ngắn để Mailpit tắt
    # thì request quên mật khẩu trả 503 nhanh thay vì treo.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  # M8b: tải file comment (≤ 100 MB, kiểm chính xác ở UsageLimits → 400) và ảnh đại diện. Trần multipart cao hơn một
  # chút để request vừa quá 100 MB nhận 400 có mã riêng; quá trần → 413 của framework. Phần lớn ghi thẳng ra đĩa tạm.
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 110MB
      file-size-threshold: 1MB

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: taskly
    access-ttl: 15m
    refresh-ttl: 30d
  mail:
    from: ${MAIL_FROM:no-reply@taskly.local}
  password-reset:
    # Token nối ngay sau link-base; app mobile mở deep link này (từ M5 dev build) hoặc người dùng dán mã.
    link-base: taskly://reset-password/
    token-ttl: 30m
  idempotency:
    ttl-hours: 24
  jobs:
    enabled: true
  rate-limit:
    auth:
      max-requests: 10
      window-seconds: 60
    refresh:
      max-requests: 30
      window-seconds: 60
    # Theo tài khoản (spec mục 5.9): 5 lần / 5 phút; vượt → 429 + Retry-After. two-factor = mã 2FA (dùng chung mọi
    # endpoint nhận mã); account-password = sai mật khẩu ở DELETE me và me/2fa/disable.
    two-factor:
      max-requests: 5
      window-seconds: 300
    account-password:
      max-requests: 5
      window-seconds: 300
    # Quên mật khẩu (spec mục 5.9): 5 lần / giờ / email; vượt vẫn trả 200 nhưng không gửi thư.
    password-reset:
      max-requests: 5
      window-seconds: 3600
    # Webhook email inbound (M13a): theo IP trước khi kiểm chữ ký; theo địa chỉ nhận thư (vượt → bỏ qua địa chỉ đó,
    # mọi địa chỉ đều vượt → 429 để dịch vụ nhận thư gửi lại sau).
    email-inbound:
      per-ip:
        max-requests: 120
        window-seconds: 60
      per-address:
        max-requests: 50
        window-seconds: 3600
    # OAuth cho app bên thứ ba (M13c): POST oauth/token + oauth/revoke dùng chung một bộ đếm theo IP; vượt → 429 + Retry-After.
    oauth:
      max-requests: 30
      window-seconds: 60

# PERF (perf2): nén gzip JSON — full sync ~640 KB, danh sách 50 task ~40 KB (JSON lặp khoá nên nén còn ~1/8); điện thoại
# gửi Accept-Encoding: gzip (OkHttp / trình duyệt tự giải nén). Chỉ nén JSON ≥ 1 KB; file tải (attachment / avatar) không nén.
server:
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

taskly:
  google:
    # aud hợp lệ của ID token Google = Web client ID (app Android truyền nó làm serverClientId).
    # Người dùng tự điền GOOGLE_CLIENT_IDS trong .env; nhiều ID cách nhau bởi dấu phẩy; để trống = từ chối mọi token.
    client-ids: ${GOOGLE_CLIENT_IDS:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  # M13b — đăng nhập Apple / Facebook (luồng web trên Android) và Calendar. Người dùng tự tạo app và tự điền .env.
  apple:
    # aud hợp lệ của ID token Apple = Services ID (luồng web). Trống = từ chối mọi token Apple.
    client-ids: ${APPLE_CLIENT_IDS:}
    jwk-set-uri: https://appleid.apple.com/auth/keys
    app-redirect: taskly://oauth/apple
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    # URL công khai của GET /api/v1/auth/facebook/callback (đăng ký trong Meta for Developers).
    redirect-uri: ${FACEBOOK_REDIRECT_URI:}
    app-redirect: taskly://oauth/facebook
  calendar:
    # URL công khai của GET /api/v1/calendar/oauth/callback (đăng ký ở Google Cloud và Microsoft Entra).
    redirect-uri: ${CALENDAR_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/calendar/oauth/callback}
    app-redirect: taskly://calendar/connected
    # Tiền tố link iCal (phải là URL công khai mà Google / Outlook gọi được để đọc feed).
    feed-base-url: ${CALENDAR_FEED_BASE_URL:http://localhost:8080/api/v1/calendar/feed/}
    google:
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    outlook:
      client-id: ${OUTLOOK_CALENDAR_CLIENT_ID:}
      client-secret: ${OUTLOOK_CALENDAR_CLIENT_SECRET:}
      tenant: common
    window-past-days: 30
    window-future-days: 365
    max-tasks: 500
    default-event-minutes: 60
    sync-interval: PT5M
  totp:
    # Khoá AES-256 (base64 của 32 byte) mã hoá secret 2FA — biến TOTP_ENCRYPTION_KEY trong .env (xem .env.example).
    # Thiếu / sai → server không khởi động. Mất khoá → người đã bật 2FA chỉ đăng nhập được bằng mã khôi phục.
    encryption-key: ${TOTP_ENCRYPTION_KEY:}
    issuer: Taskly
  # M13c: webhook cho app bên thứ ba. allow-insecure chỉ bật khi dev (cho http + địa chỉ nội bộ); mặc định chặn (SSRF).
  webhooks:
    allow-insecure: ${WEBHOOKS_ALLOW_INSECURE:false}
  # M13c: push từ server. provider = fake (mặc định, không gọi mạng) | fcm (cần FCM_PROJECT_ID + file service account).
  push:
    provider: ${PUSH_PROVIDER:fake}
    project-id: ${FCM_PROJECT_ID:}
    service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
  # Giới hạn theo gói Pro của Todoist (spec 2.1) — đọc DUY NHẤT ở UsageLimits. Vượt → 422 code limit-reached.
  limits:
    active-projects: 300
    projects: 500
    project-active-tasks: 300
    project-sections: 20
    project-sections-total: 100
    labels: 500
    filters: 150
    reminders: 700
    labels-per-task: 100
    templates: 100
    backups: 21
    # M8b (spec 2.1): file đính kèm comment ≤ 100 MB, ảnh đại diện ≤ 4 MB — vượt → 400.
    comment-file-bytes: 104857600
    avatar-bytes: 4194304
    # M8a: người / dự án cá nhân (chủ + cộng tác viên + lời mời email còn hiệu lực).
    project-members: 5
  # M11: job backup hằng ngày (BackupJob) kiểm "tới nửa đêm theo múi giờ tài khoản" mỗi khoảng này.
  backups:
    check-interval: PT15M
  # Email → task (M13a). Người dùng tự cấu hình tên miền (MX trỏ về dịch vụ nhận thư) + adapter ký HMAC gửi tới
  # POST /api/v1/integrations/email/inbound. Bí mật trống = webhook từ chối mọi yêu cầu (server vẫn chạy).
  email-inbox:
    domain: ${EMAIL_INBOX_DOMAIN:inbox.taskly.local}
    webhook-secret: ${EMAIL_INBOUND_WEBHOOK_SECRET:}
    signature-tolerance: 5m
    max-body-bytes: 2097152
  # M8b: file comment + ảnh đại diện lưu trên đĩa server (LocalFileStorage). STORAGE_DIR trong .env (mặc định ./data/files).
  storage:
    root: ${STORAGE_DIR:./data/files}
    # Link tải file đính kèm ký HMAC (không cần Bearer để trình duyệt mở được) — sống ngắn.
    download-link-ttl: 5m
    # File tải lên mà chưa gắn comment quá thời gian này thì bị dọn.
    unattached-ttl: 24h
  # M8a: lời mời email hết hạn sau 7 ngày (ADR 0003); link = link-base + token (app mở deep link hoặc dán mã).
  invitations:
    ttl-days: 7
    link-base: taskly://join/

# requestId (RequestIdFilter, MDC) in trên mọi dòng log. Log không được chứa nội dung task, mật khẩu, token.
logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"
